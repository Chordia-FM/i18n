name: CI

# Validates every catalog against the English source: key parity, ICU validity, plural categories,
# placeholder preservation, invisible characters, unrestored machine-translation masks.
#
# This gate existed as an npm script long before it existed as CI, which is exactly how a broken
# plural shipped: `player:queue.addedAlbum` was written with i18next `_one`/`_other` suffix keys,
# which this project's i18next-icu setup does not resolve, so every locale fell through to a
# hard-coded English default. The checker would have caught it the day it landed. Nothing ran it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  catalogs:
    # 2vCPU on purpose: this job is one script/download, never four cores' worth of work.
    # Compile jobs stay at 4 — halving cores on parallel work doubles the time for the same
    # bill, so it would buy latency and nothing else.
    # ...and ARM, which is cheaper again. Safe HERE and nowhere else: this job ships no
    # artifact, so the architecture it ran on cannot reach production or a user's machine.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Cache npm's download cache (~/.npm). Deliberately NOT node_modules: this repo has no
          # package-lock.json, so the installed tree is re-resolved from floating ranges every run
          # and a cached tree would silently pin whichever versions the cache happened to hold.
          # ~/.npm is content-addressed and integrity-verified, and npm still revalidates registry
          # metadata, so a restored entry can only ever supply a tarball npm independently chose.
          #
          # Nothing the gate reads comes from this cache. `npm run check` validates locales/ as it
          # came out of the checkout; no generated or built artifact is cached anywhere here, so a
          # stale entry cannot make a drifted catalog pass.
          cache: npm
          # Required: setup-node's lockfile auto-discovery looks for package-lock/npm-shrinkwrap/
          # yarn.lock and hard-errors when it finds none. package.json is the only file that
          # decides what gets installed, so it is also the honest thing to key on.
          cache-dependency-path: package.json
      - run: npm ci || npm install
      - run: npm run check
