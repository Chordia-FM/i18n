name: Crowdin sync

# Uploads the source catalogs (en) to Crowdin whenever they change, and opens a PR with the latest
# translations.
#
# This previously lived in the workspace root's `.github/`, which is not a git repository — its
# `.git` is empty and has no remote — so it had never executed once. Paths are now relative to this
# repo, which IS the i18n package.
on:
  push:
    branches: [main]
    paths:
      - "locales/en/**"
      - "crowdin.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Mondays, pull in translations done over the week.

# Avoid overlapping syncs racing on the translations branch.
concurrency:
  group: crowdin
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload sources & download translations
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: chore/crowdin-translations
          create_pull_request: true
          pull_request_title: "chore(i18n): sync translations from Crowdin"
          pull_request_body: "Automated translation sync from Crowdin for @chordia/i18n."
          pull_request_base_branch_name: main
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
