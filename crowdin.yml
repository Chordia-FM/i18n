# Crowdin configuration for the shared @chordia/i18n catalogs (run the CLI from this directory).
#
# `en` is the single source of truth; Crowdin produces one folder per target language. Values are
# ICU MessageFormat held as plain JSON strings. Enable "ICU Message Syntax" in the Crowdin project
# settings so placeholders/plurals are parsed and validated (do not use the i18next plural type, which
# expects key suffixes; we keep ICU inline).
#
# Regional variants: the output folder is the BCP-47 locale (`%locale%` becomes `de-DE`, `en-GB`,
# `pt-BR`, and so on), and the shipped catalog directories are named to match. The runtime resolves
# exact → base → regional sibling → default, so a browser asking for bare `de` still gets `de-DE`
# and a regional catalog only needs the keys it overrides. Add `en-GB`/`es-MX`/etc. as target
# languages in the project and they appear here automatically, with no code change
# (SUPPORTED_LOCALES is derived from the catalog glob in index.ts).
#
# DO NOT set Crowdin Language Mapping to strip the region. It is deliberately unset, and matching
# Crowdin's own output is the whole point: a mapping has to be re-set for every new target language,
# and that is a step someone will forget. Someone already did — which is how translations spent time
# landing in `locales/de-DE/` while the app read `locales/de/`, shipping German that never loaded.
# The directories were renamed to the regional tags on 2026-07-31 to close that gap for good.
#
# ── STATE OF THIS INTEGRATION, checked 2026-07-31 ────────────────────────────────────────────────
# Sync runs through Crowdin's own GitHub integration (installed on the org), NOT a GitHub Action —
# it pushes to the `crowdin` branch, and that branch is live. Do not add a `crowdin/github-action`
# workflow alongside it: two syncs racing on different branches is worse than either alone.
#
# The integration syncs into a Crowdin BRANCH called `main` (id #34), not the project root. The CLI
# defaults to `--branch none`, so a command run without it addresses an empty root — and the four
# commands fail differently there, which is the trap. Verified against the shipped CLI 4.15.0 jar:
#
#   upload translations  errors, once per namespace: "…file '%s' is missing in the project. Run the
#                        'crowdin push' to upload the missing source". This is the ONLY command that
#                        emits that string (messages.properties:594, referenced by exactly one
#                        class, UploadTranslationsAction) — and following its advice is precisely
#                        the wrong move, see below.
#   upload sources       NO error. It creates directories and prints a green "File '<name>'" per
#                        namespace, silently laying down a SECOND set of sources at the root and
#                        leaving two divergent copies in one project. Nothing warns you.
#   status               "Project doesn't contain the '%s' file"
#   download             "Couldn't find any file to download"
#
# So do not rely on being told. Every script that addresses project FILES passes `--branch main` —
# push, push-drafts, status on the script line, pull from inside scripts/pull-translations.mjs.
# (`crowdin:lint` does not: it validates this file and never reaches the project.) Pass it by hand
# for any ad-hoc command, because the one command that would quietly do real damage is also the one
# that will not complain.
#
# DO NOT MERGE THE `crowdin` BRANCH. Pull with `bun run crowdin:pull` instead.
#
# The GitHub integration writes that branch as a full picture of what Crowdin holds, so merging it
# applies Crowdin's *absences* as deletions. Re-measured 2026-07-31 against `origin/crowdin`, it
# would still:
#   - delete `locales/en-x-pirate/` and `locales/en-x-piglatin/` entirely (3,248 lines) — Crowdin
#     has never heard of them, by design: they are generated by scripts/generate-fun-locales.mjs
#     and deliberately `ignore`d below;
#   - resurrect a bare `locales/es/` alongside `locales/es-ES/`. That directory is dead history — 4
#     files, untouched since the branch's "Initial commit", while `es-ES/` has all 16 and takes
#     every new translation — but the eager glob in index.ts does not know that and would ship two
#     competing Spanish catalogs;
#   - roll `locales/en/`, the SOURCE catalog, back to 2026-07-17 — deleting 247 real keys (1,454 on
#     main, 1,219 on the branch, 12 of which exist only there). That number is CURRENT, not
#     historical, and `crowdin:push` does not shrink it: pushing sends sources to Crowdin the
#     service, which is not the same thing as the git branch. The integration writes only
#     translations there. `git rev-parse origin/crowdin:locales/en` equals the tree at the
#     merge-base, and 0 of the 415 branch-only commits touch `locales/en/` — over the branch's whole
#     life it has never once written a source file. So the source catalog on that branch is frozen
#     at the fork point and the gap only ever grows, tracking main.
#
# `crowdin download` writes only the translation files matched by the `files` block below. It never
# touches the source catalog and never touches a directory Crowdin does not manage, so none of the
# three failures above are reachable through it. Push sources first so Crowdin is not behind:
#
#   bun run crowdin:push        # send current en/ up  (Crowdin is the translator's view, not truth)
#   bun run crowdin:pull        # bring translations down
#   git status                  # inspect before committing — this is the whole safety net
#
# `crowdin:push` prints `[OK]` for all 16 namespaces on every run, changed or not — it is an
# idempotent replace with no diff and no "unchanged" state, so identical output twice in a row is
# expected and proves nothing either way.
#
# Crowdin's JSON export writes `""` for every untranslated string rather than omitting the key, and
# nothing available here changes that. Both of the obvious levers were tried and left the output
# byte-identical at 1,920 empties across seven locales: ticking "Skip untranslated strings" in the
# project's export settings, and passing --skip-untranslated-strings to `crowdin download`.
#
# That difference is not cosmetic. A missing key falls back to English; an empty string is found,
# treated as a translation, and rendered as nothing — so the UI goes blank precisely where a
# translation is absent. `bun run crowdin:pull` therefore runs scripts/pull-translations.mjs, which
# downloads and then strips empties, and check-catalogs.mjs fails on any that survive. Do not
# "simplify" the pull back to a bare `crowdin download`.
#
# `crowdin:push-drafts` (`upload translations`) is NOT a setup step, and running it today would be
# a round trip to nowhere. It exists to carry translations that were written in this repo up to
# Crowdin as unapproved suggestions — and as of 2026-07-31 there are none: every string under
# `locales/<lang>/` arrived via `crowdin:pull`, so uploading it back would re-suggest Crowdin's own
# output against itself. It earns its keep only if someone edits a translation in-repo (a typo fix
# shipped ahead of a Crowdin round trip); then it is the way to stop that edit being silently
# reverted by the next pull. Note the precondition that `crowdin:push` does not share: `upload
# translations` can only attach to source files Crowdin ALREADY has, so it fails with "file is
# missing in the project" — once per namespace — when the mapping resolves to nothing.
#
# Approvals are a separate axis from translation, and nothing here touches them: the pull takes
# translated strings regardless of approval state. If proofreading ever becomes a gate, that is
# `--export-only-approved` on the download, not a change to any of the above.
#
# Crowdin Enterprise, so the CLI must be pointed at the organization's own API host — the default
# is crowdin.com and every command would authenticate against the wrong instance. Note the `api`
# segment: the API host is `<org>.api.crowdin.com`, not the `<org>.crowdin.com` you log in to.
# `CROWDIN_BASE_URL` overrides this if you ever point the same checkout at another organization.
"base_url": "https://naila.api.crowdin.com"

# Auth comes from the environment (set in CI / locally), never committed:
"project_id_env": CROWDIN_PROJECT_ID
"api_token_env": CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /locales/en/**/*.json
    translation: /locales/%locale%/**/%original_file_name%
    type: json
    # The joke locales are generated from English by scripts/generate-fun-locales.mjs, not
    # translated. Uploading them would put machine-mangled English in front of human translators
    # and invite Crowdin to treat `en-x-pirate` as a target language needing 1,418 strings of
    # attention. They are regenerated on every English change, so nothing here needs syncing.
    ignore:
      - /locales/en-x-pirate/**
      - /locales/en-x-piglatin/**
