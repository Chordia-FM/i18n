# Crowdin configuration for the shared @chordia/i18n catalogs (run the CLI from this directory).
#
# `en` is the single source of truth; Crowdin produces one folder per target language. Values are
# ICU MessageFormat held as plain JSON strings. Enable "ICU Message Syntax" in the Crowdin project
# settings so placeholders/plurals are parsed and validated (do not use the i18next plural type, which
# expects key suffixes; we keep ICU inline).
#
# Regional variants: the output folder is the BCP-47 locale (`%locale%` becomes `en-GB`, `pt-BR`, and
# so on), so regional targets land in `locales/en-GB/` etc. and the runtime resolves them from exact
# to base to default (a regional catalog only needs the keys it overrides). For a generic language
# that should live at the bare code (e.g. `locales/es/`, not `locales/es-ES/`), set Crowdin Language
# Mapping for that target so its `locale` placeholder is the 2-letter code. Add `en-GB`/`es-MX`/etc.
# as target languages in the project and they appear here automatically, with no code change
# (SUPPORTED_LOCALES is derived).
#
# ── STATE OF THIS INTEGRATION, checked 2026-07-31 ────────────────────────────────────────────────
# Sync runs through Crowdin's own GitHub integration (installed on the org), NOT a GitHub Action —
# it pushes to the `crowdin` branch, and that branch is live. Do not add a `crowdin/github-action`
# workflow alongside it: two syncs racing on different branches is worse than either alone.
#
# The integration syncs into a Crowdin BRANCH called `main` (id #34), not the project root. The CLI
# defaults to `--branch none`, so every command run without it looks at an empty root and reports
# "file is missing in the project" — and following that error's advice (`crowdin push`) would upload
# a SECOND set of sources at the root, leaving two divergent copies in one project. The npm scripts
# in package.json all pass `--branch main` for this reason; pass it by hand for any ad-hoc command.
#
# DO NOT MERGE THE `crowdin` BRANCH. Pull with `npm run crowdin:pull` instead.
#
# The GitHub integration writes that branch as a full picture of what Crowdin holds, so merging it
# applies Crowdin's *absences* as deletions. Measured on 2026-07-31 it would have:
#   - deleted `locales/en-x-pirate/` and `locales/en-x-piglatin/` entirely (3,248 lines) — Crowdin
#     has never heard of them, by design: they are generated by scripts/generate-fun-locales.mjs
#     and deliberately `ignore`d below;
#   - removed 247 keys from `locales/en/`, the SOURCE catalog, because Crowdin's copy of the source
#     was older than main;
#   - resurrected a stale bare `locales/es/` alongside `locales/es-ES/`, which the eager glob in
#     index.ts would then ship as two competing Spanish catalogs.
#
# `crowdin download` writes only the translation files matched by the `files` block below. It never
# touches the source catalog and never touches a directory Crowdin does not manage, so none of the
# three failures above are reachable through it. Push sources first so Crowdin is not behind:
#
#   npm run crowdin:push        # send current en/ up  (Crowdin is the translator's view, not truth)
#   npm run crowdin:pull        # bring translations down
#   git status                  # inspect before committing — this is the whole safety net
#
# The CLI does NOT inherit the project's Translations Export Settings. `crowdin download` builds its
# own export and takes the options as flags, so ticking "Skip untranslated strings" in the Crowdin
# UI changes nothing for a CLI pull — the download still arrives with every untranslated entry
# "fulfilled with the source language", which for JSON means an empty string, not the English text.
# That is why `crowdin:pull` passes --skip-untranslated-strings explicitly. Keep it there.
#
# One thing is currently misconfigured on the Crowdin side, and needs fixing THERE, not here:
#
#  1. **Language Mapping is unset**, so exports land in `locales/de-DE/`, `fr-FR/`, `ja-JP/`,
#     `ko-KR/`, `es-ES/` while the app ships bare `de/`, `fr/`, `ja/`, `ko/`, `es/`. `index.ts`
#     glob-imports `./locales/*/*.json` eagerly, so merging that branch as-is would ship BOTH — two
#     half-populated German catalogs in the bundle. Set Language Mapping per target so `%locale%`
#     resolves to the bare code (see the note further down).
#
#     (The integration's own exports have the same hazard, which is what filled `locales/de-DE/` on
#     the branch with 121 keys of pure English — but that is governed by the UI setting, not by the
#     CLI flag above. Both surfaces need their own fix; neither covers the other.)
#
# And the thing to do BEFORE inviting translators: this repo's `de`/`fr`/`ja`/`ko`/`pt-BR` catalogs
# hold real, human translations that Crowdin has never seen — `main` is AHEAD of Crowdin, not behind
# it. Run `npm run crowdin:push-drafts` first so translators start from that work instead of a blank
# project, and so Crowdin stops treating good German as an untranslated string.
#
# Crowdin Enterprise, so the CLI must be pointed at the organization's own API host — the default
# is crowdin.com and every command would authenticate against the wrong instance. Note the `api`
# segment: the API host is `<org>.api.crowdin.com`, not the `<org>.crowdin.com` you log in to.
# `CROWDIN_BASE_URL` overrides this if you ever point the same checkout at another organization.
"base_url": "https://naila.api.crowdin.com"

# Auth comes from the environment (set in CI / locally), never committed:
"project_id_env": CROWDIN_PROJECT_ID
"api_token_env": CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /locales/en/**/*.json
    translation: /locales/%locale%/**/%original_file_name%
    type: json
    # The joke locales are generated from English by scripts/generate-fun-locales.mjs, not
    # translated. Uploading them would put machine-mangled English in front of human translators
    # and invite Crowdin to treat `en-x-pirate` as a target language needing 1,418 strings of
    # attention. They are regenerated on every English change, so nothing here needs syncing.
    ignore:
      - /locales/en-x-pirate/**
      - /locales/en-x-piglatin/**
